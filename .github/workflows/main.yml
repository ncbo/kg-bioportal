name: run tests
on: [push]
jobs:
  run-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: setup python
        with:
          python-version: "3.10"
      - name: Install Dependencies
        # `pip install .[test]` used to be here, but the project declares its test
        # tooling as a Poetry dev *group*, not an extra — pip warned and installed
        # nothing, so pytest was never present. Install it directly.
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
          pip install types-PyYAML
          pip install types-requests
      - name: Run tests
        run: pytest tests -q
