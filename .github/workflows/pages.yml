name: Deploy docs site to Pages

# Builds and deploys the kg-bioportal docs site (Jekyll) to GitHub Pages.
#
# Unlike the old "deploy from a branch" mode, this actually runs
# docs/build_site.sh first, which:
#   - fetches the latest transform stats from the release,
#   - regenerates _config.yml, and
#   - generates the KG-Registry-driven browser (browse + summary pages)
#     under docs/graphs/.
# Then Jekyll builds the site and it is deployed to Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps for site generation
        run: pip install pyyaml
      - uses: ruby/setup-ruby@v1
        with:
          # Ruby 3.1: the github-pages gem pins an old Liquid that calls
          # String#tainted?, which Ruby removed in 3.2. This matches GitHub's
          # own Pages build environment.
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: docs
      - uses: actions/configure-pages@v5
      - name: Assemble site (stats, KG browser)
        run: bash build_site.sh
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata (bundled in the github-pages gem) needs to
          # know the repo; GitHub's native Pages build sets these automatically,
          # a custom Actions build must pass them.
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
