name: Transform ontologies to KGX

# Downloads BioPortal ontologies, transforms each to KGX (nodes/edges), and
# publishes the results as assets on a GitHub Release of this repo. Each
# ontology yields a base graph (<ACRONYM>.tar.gz, imports stripped) and, where
# it declares imports, a full graph (<ACRONYM>_full.tar.gz, imports merged in).
#
# Ontologies too large or too slow for a GitHub-hosted runner are skipped:
#   - a static skiplist of known giants (src/kg_bioportal/config.py),
#   - a source-size gate (--max_source_mb), and
#   - a per-ontology wall-clock cap (--timeout_min).
#
# Requires the repository secret NCBO_API_KEY (a BioPortal / NCBO API key).

on:
  workflow_dispatch:
    inputs:
      ontologies:
        description: "Space-separated acronyms to run instead of the full list (testing). Blank = all."
        required: false
        default: ""
      num_shards:
        description: "Number of parallel shards"
        required: false
        default: "20"
      max_source_mb:
        description: "Skip ontologies whose source exceeds this many MB"
        required: false
        default: "250"
      timeout_min:
        description: "Per-graph wall-clock cap (minutes); the base and full graph of one ontology each get this"
        required: false
        default: "30"
      full_graphs:
        description: "Also build each ontology's full graph (imports merged in by ROBOT) as <ACRONYM>_full.tar.gz"
        required: false
        type: boolean
        default: true
      rebuild_all:
        description: "Retransform every ontology, ignoring version-skip, in batches run one after another (each batch is its own release, under the 1000-asset cap). Leave ontologies blank."
        required: false
        type: boolean
        default: false
      batch_size:
        description: "Ontologies per batch of a rebuild-all"
        required: false
        default: "330"
      rebuild_after:
        description: "Internal: the last acronym of the previous batch of a rebuild-all. Set by the chain; leave blank."
        required: false
        default: ""
  # Monthly. Version-skip (in prepare) means a scheduled run only (re)transforms
  # ontologies whose BioPortal submission changed since the last index, so each
  # run's release stays well under the 1000-asset cap; a month with no changes is
  # a clean no-op.
  schedule:
    - cron: "0 4 1 * *"  # 04:00 UTC on the 1st of each month

permissions:
  contents: write
  actions: write  # a rebuild-all batch dispatches the batch after it

concurrency:
  group: transform-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_SOURCE_MB: ${{ github.event.inputs.max_source_mb || '250' }}
  TIMEOUT_MIN: ${{ github.event.inputs.timeout_min || '30' }}
  NUM_SHARDS: ${{ github.event.inputs.num_shards || '20' }}
  # A scheduled run has no inputs; full graphs are on unless a dispatch turns them off.
  FULL_FLAG: ${{ github.event.inputs.full_graphs == 'false' && '--no_full' || '--full' }}
  REBUILD_ALL: ${{ github.event.inputs.rebuild_all == 'true' && 'true' || 'false' }}
  BATCH_SIZE: ${{ github.event.inputs.batch_size || '330' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
      tag: ${{ steps.rel.outputs.tag }}
      batch_last: ${{ steps.batch.outputs.last }}
      batch_more: ${{ steps.batch.outputs.more }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: pip install .
      - name: Get ontology list
        if: ${{ github.event_name == 'schedule' || github.event.inputs.ontologies == '' }}
        run: kgbioportal get-ontology-list -o data/raw -k "$NCBO_API_KEY"
        env:
          NCBO_API_KEY: ${{ secrets.NCBO_API_KEY }}
      - name: Fetch the current index (version-skip, and the sizes shards balance on)
        # Not just for a full run: a targeted re-run needs the source sizes too,
        # and it is the case where an unbalanced shard hurts most -- few
        # ontologies, few shards, one heavyweight setting the wall-clock.
        run: gh release download -p onto_stats.yaml -D prev || echo "No index yet; will transform all."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Cut this run's batch of a rebuild-all
        id: batch
        # A rebuild-all retransforms everything, and everything does not fit in
        # one release (1,000 assets; about 1.1 per ontology). So it runs as a
        # chain: each run takes the next batch_size acronyms after the previous
        # batch's last one, in sorted order, and finalize dispatches the run
        # after it. The batch is handed to shard-list as an explicit list, which
        # is never version-skipped.
        if: ${{ env.REBUILD_ALL == 'true' && github.event.inputs.ontologies == '' }}
        run: kgbioportal rebuild-batch -f data/raw/ontologylist.tsv --after "${{ github.event.inputs.rebuild_after }}" --size "$BATCH_SIZE" | tee -a "$GITHUB_OUTPUT"
      - name: Compute shards
        id: shard
        # Explicit ontologies input: transform exactly those (no version-skip).
        # Full list: version-skip against the current index — only new/changed
        # BioPortal submissions are (re)transformed; unchanged graphs carry forward.
        # Rebuild-all: this run's batch, as an explicit list.
        #
        # All pass --index: it carries the source sizes the shards are balanced
        # by, and version-skip applies only to the full list, so an explicit list
        # is still transformed exactly as given.
        #
        # --max_source_mb must match the one `transform` runs under: an ontology
        # the index already shows above the gate is skipped at download, so it
        # weighs nothing here. Without it the 2026-08-25 run gave four such
        # giants a shard each and eight of twenty shards did no work at all.
        run: |
          if [ -n "${{ github.event.inputs.ontologies }}" ]; then
            SHARDS=$(kgbioportal shard-list -d "${{ github.event.inputs.ontologies }}" -n "$NUM_SHARDS" --index prev/onto_stats.yaml --max_source_mb "$MAX_SOURCE_MB")
          elif [ "$REBUILD_ALL" = "true" ]; then
            SHARDS=$(kgbioportal shard-list -d "${{ steps.batch.outputs.ontologies }}" -n "$NUM_SHARDS" --index prev/onto_stats.yaml --max_source_mb "$MAX_SOURCE_MB")
          else
            SHARDS=$(kgbioportal shard-list -f data/raw/ontologylist.tsv -n "$NUM_SHARDS" --index prev/onto_stats.yaml --max_source_mb "$MAX_SOURCE_MB")
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
      - name: Create release
        id: rel
        # Skip entirely when version-skip found nothing changed (empty shard set).
        if: ${{ steps.shard.outputs.shards != '[]' }}
        # Each run gets its own release holding only the ontologies it transforms
        # (releases are incremental; a release holds <=1000 assets). Create it with
        # --latest=false: gh/GitHub default make_latest=true, which would otherwise
        # make this (still-index-less) release "latest" and break finalize's seed
        # download of the PREVIOUS index. finalize marks this release latest at the
        # end, once it holds the full index.
        run: |
          TAG="data-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --latest=false \
            --title "KGX transforms $TAG" \
            --notes "BioPortal ontologies transformed to KGX nodes/edges in this run. Assets are <ACRONYM>.tar.gz (base graph, imports stripped) and <ACRONYM>_full.tar.gz (full graph, imports merged in). The onto_stats.yaml here is the full cross-release index."
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

  transform:
    needs: prepare
    # Nothing to do when version-skip produced an empty shard set.
    if: ${{ needs.prepare.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package
        run: pip install .
      - name: Download shard
        run: kgbioportal -v download -d "${{ matrix.shard }}" -o data/raw -k "$NCBO_API_KEY" --max_source_mb "$MAX_SOURCE_MB"
        env:
          NCBO_API_KEY: ${{ secrets.NCBO_API_KEY }}
      - name: Transform shard
        # Writes <ACRONYM>.tar.gz (base graph, imports stripped) and, where the
        # ontology declares imports ROBOT can fetch, <ACRONYM>_full.tar.gz (full
        # graph, imports merged in). Each graph gets its own timeout.
        run: kgbioportal -v transform -i data/raw -o data/transformed --timeout_min "$TIMEOUT_MIN" --max_source_mb "$MAX_SOURCE_MB" $FULL_FLAG
        env:
          ROBOT_JAVA_ARGS: "-Xmx13g -XX:+UseG1GC"
      - name: Upload KGX artifacts to release
        run: |
          shopt -s nullglob
          files=(data/transformed/*.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber
          else
            echo "No artifacts produced by this shard."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save stats fragment
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ strategy.job-index }}
          path: data/transformed/onto_stats.yaml
          if-no-files-found: ignore

  finalize:
    needs: [prepare, transform]
    # Run whenever there was work (even if some shards failed); skip a no-op run.
    if: ${{ always() && needs.prepare.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Download stats fragments
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: fragments
      - name: Fetch the previous latest index to seed from
        # No tag = the current latest release, i.e. the PREVIOUS run's release
        # (this run's release is not marked latest until the end of finalize).
        # Its onto_stats is the full cross-release index carrying every
        # ontology's download_url.
        run: gh release download -p onto_stats.yaml -D base || echo "No previous index to seed from."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge stats (build the full cross-release index)
        run: python .github/scripts/merge_stats.py fragments docs "$(date -u +%Y-%m-%d)" base/onto_stats.yaml "${{ needs.prepare.outputs.tag }}"
      - name: Publish the full index on this run's release
        # The index (onto_stats/total_stats) is authoritative and lives on every
        # release; each OK entry's download_url points at whichever release holds
        # its most recent artifact. The docs site fetches these from latest.
        # graph_urls.tsv is the same acronym -> artifact mapping in a form a
        # shell can resolve, since no single release can hold every artifact
        # (GitHub caps a release at 1000 assets; there are more than that).
        run: gh release upload "${{ needs.prepare.outputs.tag }}" docs/onto_stats.yaml docs/total_stats.yaml docs/graph_urls.tsv --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mark this run's release as latest
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Dispatch the next batch of the rebuild-all
        # Only once this run's index is latest, so the next batch seeds from
        # it. Same ref and same settings, cursor moved to this batch's last
        # acronym. Dispatching one at a time is deliberate: the concurrency
        # group keeps one pending run and cancels older pending ones, so
        # dispatching every batch at once would lose all but two.
        if: ${{ needs.prepare.outputs.batch_more == 'true' }}
        run: |
          gh workflow run transform.yml --ref "${{ github.ref_name }}" \
            -f rebuild_all=true \
            -f rebuild_after="${{ needs.prepare.outputs.batch_last }}" \
            -f batch_size="$BATCH_SIZE" \
            -f num_shards="$NUM_SHARDS" \
            -f max_source_mb="$MAX_SOURCE_MB" \
            -f timeout_min="$TIMEOUT_MIN" \
            -f full_graphs="${{ github.event.inputs.full_graphs != 'false' }}"
        env:
          GH_TOKEN: ${{ github.token }}
