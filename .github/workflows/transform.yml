name: Transform ontologies to KGX

# Downloads BioPortal ontologies, transforms each to KGX (nodes/edges), and
# publishes the results as assets on a GitHub Release of this repo.
#
# Ontologies too large or too slow for a GitHub-hosted runner are skipped:
#   - a static skiplist of known giants (src/kg_bioportal/config.py),
#   - a source-size gate (--max_source_mb), and
#   - a per-ontology wall-clock cap (--timeout_min).
#
# Requires the repository secret NCBO_API_KEY (a BioPortal / NCBO API key).

on:
  workflow_dispatch:
    inputs:
      ontologies:
        description: "Space-separated acronyms to run instead of the full list (testing). Blank = all."
        required: false
        default: ""
      num_shards:
        description: "Number of parallel shards"
        required: false
        default: "20"
      max_source_mb:
        description: "Skip ontologies whose source exceeds this many MB"
        required: false
        default: "50"
      timeout_min:
        description: "Per-ontology wall-clock cap (minutes)"
        required: false
        default: "30"
  # Monthly schedule — temporarily disabled until the workflow has been
  # validated with a manual dry-run. Re-enable once a small run passes.
  # schedule:
  #   - cron: "0 4 1 * *"  # 04:00 UTC on the 1st of each month

permissions:
  contents: write

concurrency:
  group: transform-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_SOURCE_MB: ${{ github.event.inputs.max_source_mb || '50' }}
  TIMEOUT_MIN: ${{ github.event.inputs.timeout_min || '30' }}
  NUM_SHARDS: ${{ github.event.inputs.num_shards || '20' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: pip install .
      - name: Get ontology list
        if: ${{ github.event_name == 'schedule' || github.event.inputs.ontologies == '' }}
        run: kgbioportal get-ontology-list -o data/raw -k "$NCBO_API_KEY"
        env:
          NCBO_API_KEY: ${{ secrets.NCBO_API_KEY }}
      - name: Compute shards
        id: shard
        run: |
          if [ -n "${{ github.event.inputs.ontologies }}" ]; then
            SHARDS=$(kgbioportal shard-list -d "${{ github.event.inputs.ontologies }}" -n "$NUM_SHARDS")
          else
            SHARDS=$(kgbioportal shard-list -f data/raw/ontologylist.tsv -n "$NUM_SHARDS")
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
      - name: Create release
        id: rel
        run: |
          TAG="data-$(date +%Y.%m)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --latest \
              --title "KGX transforms $TAG" \
              --notes "BioPortal ontologies transformed to KGX nodes/edges. Assets are <ACRONYM>.tar.gz. Generated by the transform workflow."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  transform:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package
        run: pip install .
      - name: Download shard
        run: kgbioportal -v download -d "${{ matrix.shard }}" -o data/raw -k "$NCBO_API_KEY" --max_source_mb "$MAX_SOURCE_MB"
        env:
          NCBO_API_KEY: ${{ secrets.NCBO_API_KEY }}
      - name: Transform shard
        run: kgbioportal -v transform -i data/raw -o data/transformed --timeout_min "$TIMEOUT_MIN"
        env:
          ROBOT_JAVA_ARGS: "-Xmx13g -XX:+UseG1GC"
      - name: Upload KGX artifacts to release
        run: |
          shopt -s nullglob
          files=(data/transformed/*.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber
          else
            echo "No artifacts produced by this shard."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save stats fragment
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ strategy.job-index }}
          path: data/transformed/onto_stats.yaml
          if-no-files-found: ignore

  finalize:
    needs: [prepare, transform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Download stats fragments
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: fragments
      - name: Merge stats
        run: python .github/scripts/merge_stats.py fragments docs
      - name: Attach stats to release
        # The release is the single source of truth for stats; main is a
        # protected branch, so we do NOT commit them back to the repo. The docs
        # site build (docs/build_site.sh) fetches these from the latest release.
        run: gh release upload "${{ needs.prepare.outputs.tag }}" docs/onto_stats.yaml docs/total_stats.yaml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
