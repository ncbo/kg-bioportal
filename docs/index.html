<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KG-Bioportal</title>

       live here (the summary statistics and figures) is now the browser's
       Summary page. Keep this URL working by sending it straight there. -->

  <meta http-equiv="refresh" content="0; url={{ '/graphs/' | relative_url }}">
  <script>location.replace({{ '/graphs/' | relative_url | jsonify }});</script>
</head>
<body>
  <p>Redirecting to the <a href="{{ '/graphs/' | relative_url }}">KG-Bioportal graph browser</a>…</p>
</body>
