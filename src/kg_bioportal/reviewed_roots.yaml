  reviewed: 2026-08-26
  reviewer: Claude (model version not recorded), in a Claude Code session with the maintainer; shipped in #176
  confirmed_by: ""
  # GEXO, REXO and RETO are rooted at SIO:000000 and hang their classes off
  # these three; GSSO puts BFO's qualities under SIO's attribute, and HASCO,
  # HHEAR, MATERIALSMINE, POEM and MSV each hang a few dozen classes off
  # them. SIO's own graph is where the labels were read. Measured on
  # data-2026.09.09: without this list GSSO loses 1,222 nodes and the other
  # five lose 200 between them.
  also: [GEXO, REXO, RETO, GSSO, HASCO, HHEAR, MATERIALSMINE, POEM, MSV]
  roots:
    - id: SIO:000776
      label: object
      category: biolink:PhysicalEntity
      reach: 1583
      evidence: [material entity, spatial region, information content entity]
    - id: SIO:000614
      label: attribute
      category: biolink:Attribute
      reach: 0
      evidence: [quality, realizable entity, quantity]
    - id: SIO:000006
      label: process
      category: biolink:Activity
      reach: 0
      evidence: [procedure, interaction, biological process]
  refused:
    - id: SIO:000000
      label: entity
      why: The top. Seeding it only re-derives NamedThing.

