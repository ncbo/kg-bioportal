# Roots whose Biolink category was decided by review, one ontology at a time.
#
# The seed table in categories.py holds terms whose meaning is not in doubt.
# Everything here needed a judgement about one ontology -- what an ICD chapter
# holds, what HGNC's locus groups are -- and each judgement was made by reading
# the root and its subclasses in the published graph, with the assistance of
# an AI agent. That is why this is a file and not a table: every entry carries
# who decided it, when, from which graph, what they read, and whether a
# maintainer has since confirmed it. The transform counts the nodes that owe
# their category to these roots apart from the rest, and the site says so on
# every page it applies to.
#
# The bar each root had to clear is REVIEW_BAR in categories.py. Roots that
# were read and turned down are listed under `refused`, with the reason: a
# refusal is part of the record, and stops the same root being re-read later.
#
# Shape:
#   ACRONYM:
#     graph:        the release whose artifact was read
#     reviewed:     date
#     reviewer:     who, as specifically as is known
#     confirmed_by: a maintainer's handle once checked by a person; blank until then
#     also:         other ontologies the same roots apply to, if any
#     roots:        [{id, label, category, reach, evidence: [child labels], note?}]
#     refused:      [{id, label, why}]
#
# `reach` is the number of nodes beneath the root in the graph read, before
# the review; the transform's own count is the one the site shows.

# --------------------------------------------------------------------------
# Reviewed 2026-08-26 for #176, in the session that added them to the seed
# table. Moved here on 2026-09-10 because they were never facts about a term;
# they were readings of an ontology, and belong with the other readings.
# --------------------------------------------------------------------------

